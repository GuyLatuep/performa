name: CI

# Runs on every push to main and every pull request. Also callable from
# release.yml (`workflow_call`), so a tag build is gated on the same checks
# instead of duplicating them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to the same ref makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Date handling is timezone-sensitive and a UTC-negative zone has
        # already hidden one bug (weekRange parsed yyyy-MM-dd as UTC). Run the
        # suite on both sides of Greenwich so that class of bug can't return.
        timezone: [Europe/Berlin, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # `pnpm build` is `tsc && vite build` — typecheck and bundle in one.
      - name: Typecheck and build
        run: pnpm build

      - name: Test
        run: pnpm test

  rust:
    # macOS mirrors the primary release target and needs no system packages,
    # unlike Linux where Tauri pulls in webkit2gtk & friends.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          # Same key as release.yml so both share one cache.
          workspaces: "./src-tauri -> target"

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # `--no-fail-fast` so one failing binary doesn't hide the rest, and the
      # output is kept for the report below.
      - name: Test
        run: |
          set -o pipefail
          cargo test --no-fail-fast 2>&1 | tee /tmp/cargo-test.log

      # Vitest writes its own run summary; cargo has no equivalent, so the
      # test lines are turned into one here. Runs even when the tests failed —
      # that is when the list is worth the most.
      - name: Test report
        if: always()
        run: |
          count() { grep -c "$1" /tmp/cargo-test.log || true; }
          passed=$(count ' \.\.\. ok$')
          failed=$(count ' \.\.\. FAILED$')
          ignored=$(count ' \.\.\. ignored')
          {
            echo "## Cargo Test Report"
            echo
            echo "### Summary"
            if [ "$failed" -eq 0 ]; then
              echo "- Tests: ✅ $passed passed · $((passed + failed + ignored)) total"
            else
              echo "- Tests: ❌ $failed failed · $passed passed · $((passed + failed + ignored)) total"
            fi
            if [ "$ignored" -gt 0 ]; then
              echo "- Ignored: ⚪ $ignored"
            fi
            echo
            sed -n \
              -e 's/^test \(.*\) \.\.\. ok$/- ✅ `\1`/p' \
              -e 's/^test \(.*\) \.\.\. FAILED$/- ❌ `\1`/p' \
              -e 's/^test \(.*\) \.\.\. ignored.*$/- ⚪ `\1`/p' \
              /tmp/cargo-test.log
          } >> "$GITHUB_STEP_SUMMARY"
