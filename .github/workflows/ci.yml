name: CI

# Runs on every push to main and every pull request. Also callable from
# release.yml (`workflow_call`), so a tag build is gated on the same checks
# instead of duplicating them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A newer push to the same ref makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Date handling is timezone-sensitive and a UTC-negative zone has
        # already hidden one bug (weekRange parsed yyyy-MM-dd as UTC). Run the
        # suite on both sides of Greenwich so that class of bug can't return.
        timezone: [Europe/Berlin, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # `pnpm build` is `tsc && vite build` — typecheck and bundle in one.
      - name: Typecheck and build
        run: pnpm build

      # Coverage comes from one cell only: both cells run the same suite, so a
      # second report would just be a duplicate for Codecov to merge, and the
      # matrix exists to catch timezone bugs rather than to measure twice.
      # Both cells keep their output for the report below.
      - name: Test
        if: matrix.timezone != 'Europe/Berlin'
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/vitest.log

      - name: Test with coverage
        if: matrix.timezone == 'Europe/Berlin'
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee /tmp/vitest.log

      # Vitest prints its summary to the job log and nowhere else, so — like
      # the cargo one below — the numbers are lifted onto the run page here.
      # Both cells report, titled by timezone: a date bug shows up in one of
      # them only, and a summary from the other would call the run green.
      #
      # Failures rather than the full list: 800-odd passing bullets would bury
      # the thing worth reading. Runs even when the tests failed — that is when
      # the report is worth the most.
      - name: Test report
        if: always()
        run: |
          [ -f /tmp/vitest.log ] || exit 0
          # Vitest colours its output when it thinks something is watching.
          plain=$(sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' /tmp/vitest.log)
          line() { printf '%s\n' "$plain" | grep -E "^ *$1 " | head -1 | sed -E "s/^ *$1 +//"; }
          tests=$(line 'Tests')
          files=$(line 'Test Files')
          {
            echo "## Vitest Report — ${{ matrix.timezone }}"
            echo
            echo "### Summary"
            case "$tests" in
              *failed*) echo "- Tests: ❌ ${tests:-none run}" ;;
              "")       echo "- Tests: ⚠️ the suite did not report a total" ;;
              *)        echo "- Tests: ✅ $tests" ;;
            esac
            [ -n "$files" ] && echo "- Files: $files"
            coverage=$(printf '%s\n' "$plain" | grep -E '^(Statements|Branches|Functions|Lines) +:')
            if [ -n "$coverage" ]; then
              echo
              echo "### Coverage"
              printf '%s\n' "$coverage" | sed -E 's/^([A-Za-z]+) +: +/- \1: /'
            fi
            failed=$(printf '%s\n' "$plain" | sed -nE 's/^ *FAIL +(.*)$/- ❌ `\1`/p' | sort -u)
            if [ -n "$failed" ]; then
              echo
              echo "### Failed"
              printf '%s\n' "$failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: matrix.timezone == 'Europe/Berlin'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage is not a reason to fail a green build; the
          # coverage gate is the status check Codecov posts, not this step.
          fail_ci_if_error: false

  rust:
    # macOS mirrors the primary release target and needs no system packages,
    # unlike Linux where Tauri pulls in webkit2gtk & friends.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Its own cache, deliberately not release.yml's: llvm-cov builds with
          # instrumentation RUSTFLAGS, so sharing one key would have the two
          # jobs evicting each other's artifacts on every run.
          key: coverage

      # Prebuilt binary — installing it from source would cost more than the
      # test run it measures.
      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # `cargo llvm-cov` *runs* the tests, so this is the test step, not an
      # extra pass over them. `--lib` because the crate is also a staticlib and
      # cdylib, which llvm-cov handles badly at workspace scope — and all the
      # tests live in the lib anyway. `--no-fail-fast` so one failing binary
      # doesn't hide the rest, and the output is kept for the report below.
      - name: Test with coverage
        run: |
          set -o pipefail
          cargo llvm-cov --lib --no-fail-fast --lcov --output-path lcov.info \
            2>&1 | tee /tmp/cargo-test.log

      # Cargo prints its results to the job log and nowhere else, so the test
      # lines are turned into a run-page summary here — the same reason the
      # frontend job has one. Every test is listed rather than just the
      # failures: there are a hundred-odd of them, which is a readable list,
      # where the frontend's 800 would not be. Runs even when the tests
      # failed — that is when the list is worth the most.
      - name: Test report
        if: always()
        run: |
          count() { grep -c "$1" /tmp/cargo-test.log || true; }
          passed=$(count ' \.\.\. ok$')
          failed=$(count ' \.\.\. FAILED$')
          ignored=$(count ' \.\.\. ignored')
          {
            echo "## Cargo Test Report"
            echo
            echo "### Summary"
            if [ "$failed" -eq 0 ]; then
              echo "- Tests: ✅ $passed passed · $((passed + failed + ignored)) total"
            else
              echo "- Tests: ❌ $failed failed · $passed passed · $((passed + failed + ignored)) total"
            fi
            if [ "$ignored" -gt 0 ]; then
              echo "- Ignored: ⚪ $ignored"
            fi
            echo
            sed -n \
              -e 's/^test \(.*\) \.\.\. ok$/- ✅ `\1`/p' \
              -e 's/^test \(.*\) \.\.\. FAILED$/- ❌ `\1`/p' \
              -e 's/^test \(.*\) \.\.\. ignored.*$/- ⚪ `\1`/p' \
              /tmp/cargo-test.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./src-tauri/lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
