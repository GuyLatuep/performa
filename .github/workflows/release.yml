name: Release

# Builds signed-ready macOS and Windows bundles when a version tag is pushed.
# Push a tag like `v0.1.0` to trigger a draft GitHub Release with the artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Same checks as on main — a tag must never ship code that fails them.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # A called workflow gets no secrets unless they are passed down, and CI now
    # uploads coverage with CODECOV_TOKEN — without this a tag build would run
    # that step with an empty token.
    secrets: inherit

  # Draft release notes: every commit since the previous version tag. Its own
  # job, so the GitHub release and the upload to performa.polz.in share them.
  notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags, needed to diff commits against the last release.
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$GITHUB_REF_NAME"
          else
            RANGE="$GITHUB_REF_NAME"
          fi
          {
            echo "body<<NOTES_EOF"
            echo "## Changes since ${PREV:-the beginning}"
            echo
            git log --no-merges --pretty=format:"- %s (%h)" "$RANGE"
            echo
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [test, notes]
    # `notes` is skipped without a tag; build anyway on a manual run.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.notes.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon only
            args: "--target aarch64-apple-darwin"
            artifact: darwin-aarch64
          - platform: windows-latest # NSIS installer only (no .msi)
            args: "--bundles nsis"
            artifact: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The app's runtime version (used by the in-app update check) and the
      # bundle filenames come from tauri.conf.json / Cargo.toml, not the git
      # tag. Stamp both from the tag (e.g. v0.2.0 -> 0.2.0) so releases are
      # always correctly versioned without manual bumps.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'),p='src-tauri/tauri.conf.json',j=JSON.parse(fs.readFileSync(p));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          VERSION="$VERSION" node -e "const fs=require('fs'),p='src-tauri/Cargo.toml';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/^version = \".*\"$/m,'version = \"'+process.env.VERSION+'\"'))"
          echo "Stamped version $VERSION"
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS signing & notarization (optional; set as repo secrets) ---
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # --- Updater artifact signing (required for in-app updates) ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "performa ${{ github.ref_name }}"
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Hand the bundles to the `upload` job, under the names the GitHub
      # release gives them: tauri-action renames the macOS updater tarball,
      # which the bundler writes as plain `performa.app.tar.gz`.
      - name: Collect bundles
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist-release
          if [ "$RUNNER_OS" = macOS ]; then
            BUNDLE=src-tauri/target/aarch64-apple-darwin/release/bundle
            cp "$BUNDLE/dmg/performa_${VERSION}_aarch64.dmg" dist-release/
            cp "$BUNDLE/macos/performa.app.tar.gz" "dist-release/performa_${VERSION}_aarch64.app.tar.gz"
            cp "$BUNDLE/macos/performa.app.tar.gz.sig" "dist-release/performa_${VERSION}_aarch64.app.tar.gz.sig"
          else
            BUNDLE=src-tauri/target/release/bundle
            cp "$BUNDLE/nsis/performa_${VERSION}_x64-setup.exe" dist-release/
            cp "$BUNDLE/nsis/performa_${VERSION}_x64-setup.exe.sig" dist-release/
          fi
          ls -l dist-release

      - name: Keep bundles for upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.artifact }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  # Uploads the release to performa.polz.in, where it lands as a draft and is
  # published on /admin. The GitHub release above stays: installed versions
  # fall back to its latest.json when the site is unreachable.
  upload:
    needs: [notes, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist-release
          merge-multiple: true

      # The script lives with the site, which owns the API it talks to. Pinned
      # to a commit: this job holds the upload token.
      - name: Fetch upload script
        run: |
          curl -fsSL --retry 3 -o upload-release.mjs \
            https://raw.githubusercontent.com/polzinmalte/performa-site/f2d06fdc76523d8349d98debb0daebc4bd00d270/scripts/upload-release.mjs

      - name: Upload to performa.polz.in
        env:
          PERFORMA_UPLOAD_TOKEN: ${{ secrets.PERFORMA_UPLOAD_TOKEN }}
          NOTES: ${{ needs.notes.outputs.body }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$NOTES" > notes.md
          cd dist-release
          node ../upload-release.mjs --site https://performa.polz.in --version "$VERSION" --notes ../notes.md \
            --manual-en ../docs/user-manual.en.md --manual-de ../docs/user-manual.de.md \
            --file "performa_${VERSION}_aarch64.dmg:darwin-aarch64:installer" \
            --file "performa_${VERSION}_aarch64.app.tar.gz:darwin-aarch64:updater" \
            --file "performa_${VERSION}_x64-setup.exe:windows-x86_64:installer+updater"
